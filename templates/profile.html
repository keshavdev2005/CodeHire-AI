<!DOCTYPE html>
<html>
<head>
<title>Profile - CodeHire AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:450px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2,h3{
text-align:center;
color:#1f2937;
margin-bottom:15px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

input:focus{
border:2px solid #2563eb;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.back{
background:#374151;
}

.back:hover{
background:#111827;
}

hr{
margin:25px 0;
}

</style>

</head>

<body>

<div class="container">

<h2>👤 My Profile</h2>

<form method="POST" action="/update_profile">

<label>Username</label>
<input type="text" name="username" value="{{ username }}" required>

<label>Email</label>
<input type="email" name="email" value="{{ email }}" required>

<button type="submit">💾 Save Changes</button>

</form>

<hr>

<h3>🔒 Change Password</h3>

<form method="POST" action="/change_password">

<label>Current Password</label>
<input type="password" name="old_password" required>

<label>New Password</label>
<input type="password" name="new_password" required>

<label>Confirm Password</label>
<input type="password" name="confirm_password" required>

<button type="submit">🔑 Change Password</button>

</form>

<br>

<a href="/dashboard">
<button class="back">⬅️ Back to Dashboard</button>
</a>

</div>

</body>
</html>
