<!DOCTYPE html>
<html>
<head>
<title>Register - CodeHire AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2563eb,#1e3a8a);
}

.register-box{
width:420px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
text-align:center;
}

.register-box h1{
margin-bottom:10px;
color:#1f2937;
}

.register-box p{
color:gray;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:none;
}

input:focus{
border:2px solid #2563eb;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

a{
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="register-box">

<h1>Create Account</h1>

<p>Join CodeHire AI</p>

<form method="POST" action="/register">

<input type="text" name="username" placeholder="Username" required>

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

<br>

Already have an account?

<br><br>

<a href="/">Login Here</a>

</div>

</body>
</html>
