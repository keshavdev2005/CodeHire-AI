<!DOCTYPE html>
<html>

<head>

<title>History - CodeHire AI</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

.navbar{
background:#1f2937;
padding:15px;
}

.navbar a{
color:white;
text-decoration:none;
margin-right:25px;
font-weight:bold;
}

.navbar a:hover{
color:gold;
}

.container{
width:95%;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
margin-top:20px;
}

h2{
color:#2563eb;
}

input{
padding:10px;
width:250px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#2563eb;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

tr:hover{
background:#eef4ff;
}

.delete{
background:#dc2626;
}

.delete:hover{
background:#b91c1c;
}

</style>

</head>

<body>

<div class="navbar">

<a href="/dashboard">Dashboard</a>

<a href="/history">History</a>

<a href="/profile">Profile</a>

<a href="/logout">Logout</a>

</div>

<div class="container">

<div class="card">

<h2>📜 Analysis History</h2>

<form method="GET">

<input
type="text"
name="search"
placeholder="Search Language..."
value="{{ search }}">

<button type="submit">
Search
</button>

</form>

<table>

<tr>

<th>Language</th>

<th>Score</th>

<th>Complexity</th>

<th>Date</th>

<th>Delete</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

<td>

<a href="/delete_history/{{ row[0] }}">

<button
class="delete"
onclick="return confirm('Delete this analysis?')">

Delete

</button>

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</body>

</html>
