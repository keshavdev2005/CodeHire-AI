<!DOCTYPE html>
<html>
<head>

<title>Login - CodeHire AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2563eb,#1e3a8a);
}

.login-box{
width:380px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
text-align:center;
}

.login-box h1{
color:#1f2937;
margin-bottom:10px;
}

.login-box p{
color:gray;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:none;
}

input:focus{
border:2px solid #2563eb;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

.link{
margin-top:15px;
}

.link a{
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

.link a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

<h1>CodeHire AI</h1>

<p>Login to continue</p>

<form method="POST" action="/login">

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>
<div class="link">
    <a href="/forgot_password">Forgot Password?</a>
</div>

<div class="link">
    <p>Don't have an account?</p>

    <a href="/register">
        Register Here
    </a>
</div>

</div>

</body>
</html>
